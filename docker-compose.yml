services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ADCRAFT_DATA_DIR: /app/data/runtime
    volumes:
      - adcraft-data:/app/data/runtime
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
volumes:
  adcraft-data:
